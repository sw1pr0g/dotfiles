---
# Setting up zed:
- link:
    "~/.config/zed/settings.json":
      path: zed/settings.json
      create: true
    "~/.config/zed/keymap.json":
      path: zed/keymap.json
      create: true

# Installing dependencies:
- brewfile:
    file: macos/Brewfile
    no-upgrade: true
    stdout: true
    stderr: true
